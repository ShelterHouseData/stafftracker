*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#111210;color:#e2e0d8;font-size:14px;padding:32px}
.card{background:#181714;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:24px;max-width:700px;margin:0 auto}
h1{font-size:18px;font-weight:500;margin-bottom:4px}
.sub{font-size:12px;color:#5a5850;margin-bottom:20px}
.btn{font-size:13px;font-weight:500;padding:8px 18px;border-radius:6px;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:#222;color:#e2e0d8;margin-right:8px}
.btn-primary{background:#2d5f8a;color:white;border-color:#2d5f8a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stats{display:flex;gap:24px;margin:16px 0}
.stat-val{font-size:28px;font-weight:300;font-family:monospace}
.stat-val.green{color:#4aab72}.stat-val.red{color:#c45a5a}.stat-val.faint{color:#5a5850}
.stat-label{font-size:10px;color:#5a5850;text-transform:uppercase;letter-spacing:.05em}
.progress{height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin:12px 0}
.progress-bar{height:100%;background:#2d5f8a;border-radius:2px;transition:width .3s;width:0}
.log{background:#0e0d0c;border-radius:6px;padding:14px;font-family:monospace;font-size:11px;max-height:320px;overflow-y:auto;margin-top:16px;white-space:pre-wrap;border:1px solid rgba(255,255,255,.05)}
.ok{color:#4aab72}.err{color:#c45a5a}.info{color:#5a9dd4}.warn{color:#c49a2a}
</style>
</head>

function log(msg, cls='') { const el=document.getElementById('log'); el.innerHTML+='\n<span class="'+cls+'">'+msg+'</span>'; el.scrollTop=el.scrollHeight; }
function clearLog() { document.getElementById('log').innerHTML=''; }
function updateStats() {
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-err').textContent=errs;
  document.getElementById('s-left').textContent=Math.max(0,DATA.length-done-errs);
  document.getElementById('prog').style.width=((done+errs)/DATA.length*100)+'%';
}

async function gFetch(url, method='GET', body=null) {
  const opts={method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  if(!r.ok){const t=await r.text();throw new Error(r.status+': '+t);}
  return method==='DELETE'?null:r.json();
}

async function startImport() {
  document.getElementById('btn-start').disabled=true;
  msalApp = new msal.PublicClientApplication({
    auth:{clientId:CLIENT_ID,authority:'https://login.microsoftonline.com/'+TENANT_ID,redirectUri:REDIRECT},
    cache:{cacheLocation:'sessionStorage'}
  });
  await msalApp.initialize();
  try {
    const accounts=msalApp.getAllAccounts();
    if(accounts.length>0){try{const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:accounts[0]});token=r.accessToken;}catch(e){const r=await msalApp.acquireTokenPopup({scopes:SCOPES});token=r.accessToken;}}
    else{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});token=r.accessToken;}
    log('Authenticated','ok');
  } catch(e){log('Auth failed: '+e.message,'err');document.getElementById('btn-start').disabled=false;return;}

  // Get site and list IDs
  const site=await gFetch('https://graph.microsoft.com/v1.0/sites/shelterhouseinc.sharepoint.com:/sites/StaffTracker');
  const siteId=site.id;
  const lists=await gFetch('https://graph.microsoft.com/v1.0/sites/'+siteId+'/lists?$filter=displayName eq \'RoleDetails\'');
  if(!lists.value?.length){log('RoleDetails list not found!','err');return;}
  listId=lists.value[0].id;
  log('Connected to RoleDetails list — importing 109 records…','info');

  for(const r of DATA){
    try{
      await gFetch('https://graph.microsoft.com/v1.0/sites/'+siteId+'/lists/'+listId+'/items','POST',{fields:r});
      done++;
      log('OK: '+r.Label+' / '+r.Subdivision,'ok');
    }catch(e){
      errs++;
      log('ERR: '+r.Label+' / '+r.Subdivision+' — '+e.message,'err');
    }
    updateStats();
    await new Promise(res=>setTimeout(res,200));
  }
  log('\n--- Done: '+done+' imported, '+errs+' errors ---','info');
}
