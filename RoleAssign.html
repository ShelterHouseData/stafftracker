<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Role Assignment Tool — Shelter House</title>
<script src="msal.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f4f1;color:#1a1916;font-size:14px;padding:24px}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
.sub{font-size:12px;color:#888;margin-bottom:20px}
.card{background:white;border-radius:10px;border:1px solid rgba(0,0,0,.08);padding:20px;margin-bottom:12px;max-width:900px}
.btn{font-size:13px;font-weight:500;padding:8px 18px;border-radius:6px;cursor:pointer;border:1px solid rgba(0,0,0,.15);background:white;margin-right:8px}
.btn-primary{background:#2d5f8a;color:white;border-color:#2d5f8a}
.btn-primary:hover{background:#1d4a6e}
.btn:disabled{opacity:.5;cursor:not-allowed}
.log{background:#1a1916;color:#e0e0e0;border-radius:8px;padding:16px;font-family:monospace;font-size:11px;max-height:200px;overflow-y:auto;margin-top:12px}
.log .ok{color:#4caf50}.log .err{color:#f44336}.log .info{color:#64b5f6}.log .warn{color:#ffb74d}
.progress{height:4px;background:#eee;border-radius:2px;margin:8px 0}
.progress-bar{height:100%;background:#2d5f8a;border-radius:2px;transition:width .3s;width:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:#666;background:#f5f4f1;border-bottom:1px solid rgba(0,0,0,.08)}
td{padding:8px 12px;border-bottom:1px solid rgba(0,0,0,.06);vertical-align:middle}
tr:hover td{background:#fafafa}
select{font-family:'Segoe UI',sans-serif;font-size:12px;padding:4px 8px;border:1px solid rgba(0,0,0,.15);border-radius:4px;background:white;width:100%}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
.badge-green{background:#edf5f0;color:#2d7a4f}
.badge-red{background:#fdf0f0;color:#a32323}
.badge-gray{background:#f0efe9;color:#6b6a65}
.stats{display:flex;gap:20px;margin-bottom:12px}
.stat{text-align:center}
.stat-val{font-size:24px;font-weight:300;font-family:monospace}
.stat-val.green{color:#2d7a4f}.stat-val.amber{color:#8a5a00}
.stat-label{font-size:10px;color:#888;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
  <h1>Role Assignment Tool</h1>
  <div class="sub">Assign roles to staff who don't have one yet. Changes write directly to SharePoint.</div>
  <div class="stats">
    <div class="stat"><div class="stat-val amber" id="s-unassigned">—</div><div class="stat-label">Need role</div></div>
    <div class="stat"><div class="stat-val green" id="s-assigned">—</div><div class="stat-label">Have role</div></div>
    <div class="stat"><div class="stat-val" id="s-saved">0</div><div class="stat-label">Saved this session</div></div>
  </div>
  <button class="btn btn-primary" onclick="startLoad()">Sign in & Load Staff</button>
  <button class="btn" id="btn-save" onclick="saveAll()" disabled>Save all assignments</button>
  <button class="btn" id="btn-refresh" onclick="loadData()" disabled>Refresh</button>
  <div class="progress"><div class="progress-bar" id="prog"></div></div>
  <div class="log" id="log">Click "Sign in & Load Staff" to begin.</div>
</div>

<div class="card" id="table-card" style="display:none;max-width:900px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <div style="font-size:13px;font-weight:500">Staff without roles</div>
    <div style="display:flex;gap:8px">
      <select id="filter-dept" onchange="renderTable()" style="width:160px">
        <option value="all">All locations</option>
      </select>
      <input type="text" id="filter-name" placeholder="Search name..." oninput="renderTable()" style="padding:4px 8px;border:1px solid rgba(0,0,0,.15);border-radius:4px;font-size:12px;width:140px">
    </div>
  </div>
  <table>
    <thead><tr><th>Name</th><th>Location</th><th>Hire date</th><th>Assign role</th><th>Status</th></tr></thead>
    <tbody id="staff-tbody"></tbody>
  </table>
</div>

<script>
const CLIENT_ID = '40c50c14-0c10-4864-a469-3ca5875c692d';
const TENANT_ID = '8d11e8a1-1159-4cd5-ad4e-bbdfbe774c87';
const REDIRECT  = 'https://shelterhousedata.github.io/stafftracker/RoleAssign.html';
const SCOPES    = ['https://graph.microsoft.com/Sites.ReadWrite.All'];
const GRAPH     = 'https://graph.microsoft.com/v1.0';
const SITE_PATH = 'shelterhouseinc.sharepoint.com:/sites/StaffTracker';

let msalApp, token, siteId;
const listIdCache = {};
let ALL_STAFF = [], ALL_ROLES = [], STAFF_ROLES = [];
let assignments = {}; // staffId -> roleId
let saved = 0;

function log(msg, cls='') {
  const el = document.getElementById('log');
  el.innerHTML += '\n<span class="' + cls + '">' + msg + '</span>';
  el.scrollTop = el.scrollHeight;
}

async function gFetch(url, method='GET', body=null) {
  const opts = { method, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }};
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if(!r.ok) throw new Error(r.status + ': ' + await r.text());
  return method==='PATCH' ? null : r.json();
}

async function getListId(name) {
  if(listIdCache[name]) return listIdCache[name];
  const r = await gFetch(GRAPH+'/sites/'+siteId+'/lists?$filter=displayName eq \''+name+'\'');
  listIdCache[name] = r.value[0].id;
  return listIdCache[name];
}

async function spFetch(name) {
  const id = await getListId(name);
  const r = await gFetch(GRAPH+'/sites/'+siteId+'/lists/'+id+'/items?expand=fields&$top=500');
  return r.value.map(i => ({id: i.id, ...i.fields}));
}

async function startLoad() {
  msalApp = new msal.PublicClientApplication({
    auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/'+TENANT_ID, redirectUri: REDIRECT },
    cache: { cacheLocation: 'sessionStorage' }
  });
  await msalApp.initialize();
  const redirect = await msalApp.handleRedirectPromise();
  if(redirect) { token = redirect.accessToken; }
  else {
    const accounts = msalApp.getAllAccounts();
    if(accounts.length > 0) {
      try { const r = await msalApp.acquireTokenSilent({scopes:SCOPES,account:accounts[0]}); token = r.accessToken; }
      catch(e) { await msalApp.acquireTokenRedirect({scopes:SCOPES}); return; }
    } else { await msalApp.acquireTokenRedirect({scopes:SCOPES}); return; }
  }
  log('Authenticated', 'ok');
  const site = await gFetch(GRAPH+'/sites/'+SITE_PATH);
  siteId = site.id;
  log('Connected to SharePoint', 'ok');
  document.getElementById('btn-refresh').disabled = false;
  await loadData();
}

async function loadData() {
  log('Loading data...', 'info');
  try {
    const [staff, roles, staffRoles] = await Promise.all([
      spFetch('Staff'), spFetch('Roles'), spFetch('StaffRoles')
    ]);
    ALL_STAFF = staff.map(s => ({
      id: s.id,
      name: s.Title || s.full_name || '',
      email: s.email || '',
      location: s.location || '',
      hire_date: s.hire_date || null,
      exit_date: s.exit_date || null
    })).filter(s => s.name && !s.exit_date).sort((a,b) => a.name.localeCompare(b.name));

    ALL_ROLES = roles.map(r => ({
      id: r.id,
      title: r.role_title || r.Title || '',
      team: r.role_team || ''
    })).sort((a,b) => a.title.localeCompare(b.title));

    STAFF_ROLES = staffRoles.map(sr => ({
      id: sr.id,
      person_id: String(sr.person_id),
      role_id: String(sr.role_id),
      end_date: sr.end_date
    }));

    // Populate dept filter
    const depts = [...new Set(ALL_STAFF.map(s=>s.location).filter(Boolean))].sort();
    const df = document.getElementById('filter-dept');
    df.innerHTML = '<option value="all">All locations</option>';
    depts.forEach(d => { const o = document.createElement('option'); o.value=d; o.textContent=d; df.appendChild(o); });

    updateStats();
    renderTable();
    document.getElementById('table-card').style.display = 'block';
    document.getElementById('btn-save').disabled = false;
    log('Loaded ' + ALL_STAFF.length + ' staff, ' + ALL_ROLES.length + ' roles', 'ok');
  } catch(e) { log('Error: ' + e.message, 'err'); }
}

function hasRole(staffId) {
  return STAFF_ROLES.some(sr => sr.person_id === String(staffId) && !sr.end_date);
}

function updateStats() {
  const noRole = ALL_STAFF.filter(s => !hasRole(s.id)).length;
  const hasRoleCount = ALL_STAFF.length - noRole;
  document.getElementById('s-unassigned').textContent = noRole;
  document.getElementById('s-assigned').textContent = hasRoleCount;
  document.getElementById('s-saved').textContent = saved;
  document.getElementById('prog').style.width = (hasRoleCount / ALL_STAFF.length * 100) + '%';
}

function renderTable() {
  const q = document.getElementById('filter-name').value.toLowerCase();
  const dept = document.getElementById('filter-dept').value;
  const unassigned = ALL_STAFF.filter(s => {
    if(hasRole(s.id)) return false;
    if(q && !s.name.toLowerCase().includes(q)) return false;
    if(dept !== 'all' && s.location !== dept) return false;
    return true;
  });

  document.getElementById('staff-tbody').innerHTML = unassigned.map(s => {
    const hireStr = s.hire_date ? new Date(s.hire_date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
    const roleOptions = ALL_ROLES.map(r =>
      '<option value="' + r.id + '" ' + (assignments[s.id] == r.id ? 'selected' : '') + '>' + r.title + (r.team ? ' — ' + r.team : '') + '</option>'
    ).join('');
    const hasAssignment = !!assignments[s.id];
    return '<tr id="row-' + s.id + '">' +
      '<td style="font-weight:500">' + s.name + '<div style="font-size:11px;color:#888">' + (s.email||'') + '</div></td>' +
      '<td style="color:#888;font-size:12px">' + (s.location||'—') + '</td>' +
      '<td style="color:#888;font-size:12px;font-family:monospace">' + hireStr + '</td>' +
      '<td><select onchange="setAssignment(\'' + s.id + '\', this.value)"><option value="">— Select role —</option>' + roleOptions + '</select></td>' +
      '<td><span class="badge ' + (hasAssignment ? 'badge-green' : 'badge-gray') + '">' + (hasAssignment ? 'Ready to save' : 'Unassigned') + '</span></td>' +
      '</tr>';
  }).join('') || '<tr><td colspan="5" style="text-align:center;color:#888;padding:20px">All staff have roles assigned!</td></tr>';
}

function setAssignment(staffId, roleId) {
  if(roleId) assignments[staffId] = roleId;
  else delete assignments[staffId];
  renderTable();
}

async function saveAll() {
  const toSave = Object.entries(assignments);
  if(toSave.length === 0) { log('No assignments to save', 'warn'); return; }
  document.getElementById('btn-save').disabled = true;
  log('Saving ' + toSave.length + ' assignments...', 'info');

  const listId = await getListId('StaffRoles');
  let ok = 0, err = 0;

  for(const [staffId, roleId] of toSave) {
    const staff = ALL_STAFF.find(s => s.id === staffId);
    try {
      await gFetch(GRAPH+'/sites/'+siteId+'/lists/'+listId+'/items', 'POST', {
        fields: { person_id: parseInt(staffId), role_id: parseInt(roleId), start_date: staff?.hire_date || new Date().toISOString().split('T')[0] }
      });
      // Add to local STAFF_ROLES so it shows as assigned
      STAFF_ROLES.push({ id: 'temp', person_id: String(staffId), role_id: String(roleId), end_date: null });
      delete assignments[staffId];
      ok++;
      saved++;
      log('Assigned: ' + (staff?.name||staffId), 'ok');
    } catch(e) {
      log('ERR: ' + (staff?.name||staffId) + ' — ' + e.message, 'err');
      err++;
    }
    await new Promise(res => setTimeout(res, 100));
  }

  log('Done: ' + ok + ' saved, ' + err + ' errors', ok > 0 ? 'ok' : 'err');
  document.getElementById('btn-save').disabled = false;
  updateStats();
  renderTable();
}
</script>
</body>
</html>
