* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f4f1; color: #1a1916; font-size: 14px; padding: 32px; }
.card { background: white; border-radius: 10px; border: 1px solid rgba(0,0,0,.08); padding: 24px; margin-bottom: 16px; max-width: 800px; }
h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.sub { font-size: 12px; color: #888; margin-bottom: 20px; }
.btn { font-size: 13px; font-weight: 500; padding: 8px 18px; border-radius: 6px; cursor: pointer; border: 1px solid rgba(0,0,0,.15); background: white; transition: all .1s; margin-right: 8px; }
.btn-primary { background: #2d5f8a; color: white; border-color: #2d5f8a; }
.btn-primary:hover { background: #1d4a6e; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.log { background: #1a1916; color: #e0e0e0; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 12px; max-height: 400px; overflow-y: auto; margin-top: 16px; }
.log .ok { color: #4caf50; }
.log .err { color: #f44336; }
.log .info { color: #64b5f6; }
.log .warn { color: #ffb74d; }
.progress { height: 6px; background: #eee; border-radius: 3px; margin: 12px 0; }
.progress-bar { height: 100%; background: #2d5f8a; border-radius: 3px; transition: width .3s; width: 0%; }
.stat { display: inline-block; margin-right: 20px; }
.stat-val { font-size: 24px; font-weight: 300; font-family: monospace; }
.stat-val.green { color: #2d7a4f; }
.stat-val.red { color: #a32323; }
.stat-val.amber { color: #8a5a00; }
.stat-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .05em; }
</style>
</head>
<body>

<div class="card">
  <h1>Shelter House Staff Import Tool</h1>
  <div class="sub">Imports 58 staff members from Staffing_WIP.xlsx into SharePoint — Phase 1: add staff, Phase 2: link managers</div>
  <div style="margin-bottom:16px">
    <span class="stat"><div class="stat-val green" id="s-done">0</div><div class="stat-label">Imported</div></span>
    <span class="stat"><div class="stat-val red" id="s-err">0</div><div class="stat-label">Errors</div></span>
    <span class="stat"><div class="stat-val amber" id="s-left">58</div><div class="stat-label">Remaining</div></span>
    <span class="stat"><div class="stat-val" id="s-mgr">0</div><div class="stat-label">Managers linked</div></span>
  </div>
  <div class="progress"><div class="progress-bar" id="prog"></div></div>
  <button class="btn btn-primary" id="btn-start" onclick="startImport()">Sign in & Start Import</button>
  <button class="btn" id="btn-diag" onclick="diagFields()">Diagnose field names</button>
  <button class="btn" id="btn-mgr" onclick="linkManagers()" disabled>Phase 2: Link Managers</button>
  <button class="btn" id="btn-clear" onclick="clearLog()">Clear log</button>
  <div class="log" id="log"><span class="info">Ready. Click "Sign in & Start Import" to begin.</span></div>
</div>

function log(msg, cls='') {
  const el = document.getElementById('log');
  el.innerHTML += '\n<span class="' + cls + '">' + msg + '</span>';
  el.scrollTop = el.scrollHeight;
}
function clearLog() { document.getElementById('log').innerHTML = ''; }
function updateStats() {
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-err').textContent = errs;
  document.getElementById('s-left').textContent = Math.max(0, STAFF_DATA.length - done - errs);
  document.getElementById('s-mgr').textContent = mgrLinked;
  document.getElementById('prog').style.width = ((done+errs)/STAFF_DATA.length*100) + '%';
}

async function getToken() {
  const accounts = msalApp.getAllAccounts();
  if(accounts.length > 0) {
    try {
      const r = await msalApp.acquireTokenSilent({scopes: SCOPES, account: accounts[0]});
      return r.accessToken;
    } catch(e) {}
  }
  const r = await msalApp.acquireTokenPopup({scopes: SCOPES});
  return r.accessToken;
}

async function gFetch(url, method='GET', body=null) {
  const opts = { method, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' } };
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if(!r.ok) { const t = await r.text(); throw new Error(r.status + ': ' + t); }
  return method === 'PATCH' ? null : r.json();
}

async function setup() {
  const site = await gFetch(GRAPH + '/sites/' + SITE_PATH);
  siteId = site.id;
  const lists = await gFetch(GRAPH + '/sites/' + siteId + '/lists?$filter=displayName eq \'Staff\'');
  staffListId = lists.value[0].id;
  log('Connected to SharePoint. Site ID: ' + siteId.split(',')[1].slice(0,8) + '...', 'ok');
  document.getElementById('btn-diag').disabled = false;
}

async function diagFields() {
  if(!token) {
    msalApp = new msal.PublicClientApplication({
      auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT_ID, redirectUri: REDIRECT },
      cache: { cacheLocation: 'sessionStorage' }
    });
    await msalApp.initialize();
    try { token = await getToken(); } catch(e) { log('Auth failed: ' + e.message, 'err'); return; }
    log('Authenticated', 'ok');
    await setup();
  }
  const r = await gFetch(GRAPH + '/sites/' + siteId + '/lists/' + staffListId + '/items?expand=fields&$top=1');
  if(r.value.length > 0) {
    log('Real field names from SharePoint:', 'info');
    Object.keys(r.value[0].fields).forEach(k => log('  ' + k + ': ' + JSON.stringify(r.value[0].fields[k]), 'ok'));
  }
}

async function startImport() {
  document.getElementById('btn-start').disabled = true;
  log('\n--- PHASE 1: Importing staff ---', 'info');
  
  msalApp = new msal.PublicClientApplication({
    auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT_ID, redirectUri: REDIRECT },
    cache: { cacheLocation: 'sessionStorage' }
  });
  await msalApp.initialize();
  
  try {
    token = await getToken();
    log('Authenticated successfully', 'ok');
    await setup();
  } catch(e) {
    log('Auth failed: ' + e.message, 'err');
    document.getElementById('btn-start').disabled = false;
    return;
  }

  // Skip staff that already exist (check by email)
  let existingEmails = new Set();
  try {
    const existing = await gFetch(GRAPH + '/sites/' + siteId + '/lists/' + staffListId + '/items?expand=fields&$top=500');
    existing.value.forEach(i => { if(i.fields.email) if(i.fields.email) existingEmails.add(i.fields.email.toLowerCase());
        if(i.fields.full_name) existingEmails.add(('name:'+i.fields.full_name).toLowerCase());
        if(i.fields.Title) existingEmails.add(('name:'+i.fields.Title).toLowerCase()); });
    log('Found ' + existingEmails.size + ' existing staff records — will skip duplicates', 'warn');
  } catch(e) { log('Could not check existing: ' + e.message, 'warn'); }

  for(const s of STAFF_DATA) {
    if(existingEmails.has((s.email||'').toLowerCase()) || 
       existingEmails.has(('name:'+s.full_name).toLowerCase())) {
      log('SKIP (exists): ' + s.full_name, 'warn');
      done++;
      updateStats();
      continue;
    }
    try {
      const r = await gFetch(
        GRAPH + '/sites/' + siteId + '/lists/' + staffListId + '/items',
        'POST',
        { fields: {
          Title: s.full_name,
          email: s.email,
          location: s.location,
          hire_date: s.hire_date,
          exit_date: s.exit_date || null,
          is_hmis_user: s.fxco || s.ldc
        }}
      );
      importedStaff.push({ name: s.full_name, spId: r.id, manager_name: s.manager_name });
      log('OK: ' + s.full_name + ' (ID: ' + r.id + ')', 'ok');
      done++;
    } catch(e) {
      log('ERR: ' + s.full_name + ' — ' + e.message, 'err');
      errs++;
    }
    updateStats();
    await new Promise(res=>setTimeout(res, 150)); // rate limit buffer
  }

  log('\n--- Phase 1 complete: ' + done + ' imported, ' + errs + ' errors ---', 'info');
  log('Click "Phase 2: Link Managers" to set manager relationships', 'info');
  document.getElementById('btn-mgr').disabled = false;
}

async function linkManagers() {
  document.getElementById('btn-mgr').disabled = true;
  log('\n--- PHASE 2: Linking managers ---', 'info');

  // Fetch all staff to build name->ID map
  let allStaff = [];
  try {
    const r = await gFetch(GRAPH + '/sites/' + siteId + '/lists/' + staffListId + '/items?expand=fields&$top=500');
    allStaff = r.value.map(i=>({ id: i.id, name: (i.fields.Title||i.fields.full_name||'').trim() }));
    log('Loaded ' + allStaff.length + ' staff records for name matching', 'info');
  } catch(e) { log('Failed to load staff: ' + e.message, 'err'); return; }

  const nameToId = {};
  allStaff.forEach(s => { nameToId[s.name.toLowerCase()] = s.id; });

  // Match each person's manager
  for(const s of STAFF_DATA) {
    if(!s.manager_name) continue;
    const managerId = nameToId[s.manager_name.toLowerCase()];
    if(!managerId) { log('WARN: Manager not found: "' + s.manager_name + '" for ' + s.full_name, 'warn'); continue; }
    const staffId = nameToId[s.full_name.toLowerCase()];
    if(!staffId) { log('WARN: Staff not found: ' + s.full_name, 'warn'); continue; }
    try {
      await gFetch(
        GRAPH + '/sites/' + siteId + '/lists/' + staffListId + '/items/' + staffId + '/fields',
        'PATCH',
        { manager: parseInt(managerId) }
      );
      log('Linked: ' + s.full_name + ' -> ' + s.manager_name, 'ok');
      mgrLinked++;
    } catch(e) {
      log('ERR linking ' + s.full_name + ': ' + e.message, 'err');
    }
    updateStats();
    await new Promise(res=>setTimeout(res, 150));
  }

  log('\n--- Phase 2 complete: ' + mgrLinked + ' managers linked ---', 'info');
  log('Done! Refresh your Staff Tracker to see all imported staff.', 'ok');
}
